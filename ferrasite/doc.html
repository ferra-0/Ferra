<!-- parsing config -->
<script>
const sidebar = document.getElementById("sidebar");
const docMain = document.getElementById("doc-main");

function capitalize(text) {
  return text.charAt(0).toUpperCase() + text.slice(1);
}

function addCopyButtons() {
  document.querySelectorAll(".code").forEach(codeBlock => {
    if (codeBlock.querySelector(".code-copy"))
      return;

    const pre = codeBlock.querySelector("pre");

    if (!pre)
      return;

    const button = document.createElement("button");

    button.className = "code-copy";
    button.textContent = "Copy";

    button.onclick = async () => {
      const code = pre.textContent;

      await navigator.clipboard.writeText(code);

      button.textContent = "Copied!";
      button.classList.add("copied");

      setTimeout(() => {
        button.textContent = "Copy";
        button.classList.remove("copied");
      }, 1200);
    };

    codeBlock.appendChild(button);
  });
}

function renderSidebar() {
  sidebar.innerHTML = "";

  for (const [sectionName, pages] of Object.entries(config)) {
    const title = document.createElement("div");

    title.className = "side-title";
    title.textContent = capitalize(sectionName);

    sidebar.appendChild(title);

    pages.forEach((page, index) => {
      const link = document.createElement("a");

      link.className = "side-link";
      link.href = `#${sectionName}/${index}`;
      link.textContent = page.theme;

      link.onclick = (event) => {
        event.preventDefault();

        openPage(sectionName, index);

        history.pushState(
          null,
          "",
          `#${sectionName}/${index}`
        );
      };

      sidebar.appendChild(link);
    });
  }
}

function openPage(sectionName, index) {
  const section = config[sectionName];

  if (!section)
    return;

  const page = section[index];

  if (!page)
    return;

  document.querySelectorAll(".side-link").forEach(link => {
    link.classList.remove("active");
  });

  const target =
    document.querySelector(
      `.side-link[href="#${sectionName}/${index}"]`
    );

  if (target)
    target.classList.add("active");

  docMain.innerHTML = `
    <div class="eyebrow">
      Documentation
    </div>

    <h2>${page.bigtext}</h2>

    <div class="doc-content">
      ${page.content}
    </div>

    ${
      page.output
        ? `
          <div class="terminal" style="margin-top:24px">
            <div class="term-top">
              <span class="dot r"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>

            <div class="term-body">
              ${page.output}
            </div>
          </div>
        `
        : ""
    }
  `;

  highlightAllFerraCode();
  addCopyButtons();
}

function openFromURL() {
  const hash = location.hash.slice(1);

  if (!hash) {
    const firstSection = Object.keys(config)[0];

    openPage(firstSection, 0);
    return;
  }

  const [sectionName, indexString] = hash.split("/");

  const index = Number(indexString);

  if (
    config[sectionName] &&
    config[sectionName][index]
  ) {
    openPage(sectionName, index);
  } else {
    const firstSection = Object.keys(config)[0];

    openPage(firstSection, 0);
  }
}

renderSidebar();
openFromURL();

window.addEventListener("popstate", openFromURL);
</script>

<!-- highlight -->
<script>
const ferraKeywords = [
  "fn", "stct", "impl", "let", "const", "ret", "if", "is", "not", "elif", "else",
  "for", "match", "take", "ftake", "as", "stop", "extern",
  "pass", "drop", "nodrop", "dropnow", "true", "false", "null", "this",
  "__llh", "__ll", "in", "or", "and", "sizeof", "typeof", "oper", "log", "logl"
];

const ferraTypes = [
  "nul", "bol", "str", "ptr",
  "i8", "i16", "i32", "i64",
  "u8", "u16", "u32", "u64",
  "isize", "usize", "hex", "f32", "f64"
];

function escapeRegex(text) {
  return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function highlightFerra(code) {
  const keywordRegex = new RegExp(
    `\\b(${ferraKeywords.map(escapeRegex).join("|")})\\b`,
    "g"
  );

  const typeRegex = new RegExp(
    `\\b(${ferraTypes.map(escapeRegex).join("|")})\\b`,
    "g"
  );

  function escapeHTML(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function highlightNormal(text) {
    text = escapeHTML(text);

    text = text.replace(
      keywordRegex,
      `<span class="kw">$1</span>`
    );

    text = text.replace(
      typeRegex,
      `<span class="ty">$1</span>`
    );

    return text;
  }

  let result = "";
  let i = 0;
  let normalStart = 0;

  while (i < code.length) {

    // // comment
    if (code[i] === "/" && code[i + 1] === "/") {
      result += highlightNormal(
        code.slice(normalStart, i)
      );

      let end = code.indexOf("\n", i);

      if (end === -1)
        end = code.length;

      const comment = code.slice(i, end);

      result +=
        `<span class="cm">${escapeHTML(comment)}</span>`;

      i = end;
      normalStart = i;

      continue;
    }

    // /* comment */
    if (code[i] === "/" && code[i + 1] === "*") {
      result += highlightNormal(
        code.slice(normalStart, i)
      );

      let end = code.indexOf("*/", i + 2);

      if (end === -1) {
        end = code.length;
      } else {
        end += 2;
      }

      const comment = code.slice(i, end);

      result +=
        `<span class="cm">${escapeHTML(comment)}</span>`;

      i = end;
      normalStart = i;

      continue;
    }

    // string
    if (code[i] === `"` || code[i] === `'`) {
      result += highlightNormal(
        code.slice(normalStart, i)
      );

      const quote = code[i];

      let end = i + 1;

      while (end < code.length) {
        if (code[end] === "\\") {
          end += 2;
          continue;
        }

        if (code[end] === quote) {
          end++;
          break;
        }

        end++;
      }

      const string = code.slice(i, end);

      result +=
        `<span class="st">${escapeHTML(string)}</span>`;

      i = end;
      normalStart = i;

      continue;
    }

    i++;
  }

  result += highlightNormal(
    code.slice(normalStart)
  );

  return result;
}

function highlightAllFerraCode() {
  document.querySelectorAll(".code pre").forEach(pre => {
    // щоб не підсвічувати повторно
    if (pre.dataset.highlighted === "true")
      return;

    const raw = pre.textContent;

    pre.innerHTML = highlightFerra(raw);
    pre.dataset.highlighted = "true";
  });
}

highlightAllFerraCode();
addCopyButtons();
</script>
