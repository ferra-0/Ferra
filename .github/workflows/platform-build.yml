name: Ferra platform packages

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libcurl4-openssl-dev

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: brew install cmake ninja curl

      - name: Install Windows dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          vcpkg install curl:x64-windows
          "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Linux package
        if: matrix.platform == 'linux'
        run: ./platforms/linux/build.sh

      - name: Build macOS package
        if: matrix.platform == 'macos'
        env:
          CMAKE_PREFIX_PATH: /opt/homebrew/opt/curl:/usr/local/opt/curl
        run: ./platforms/macos/build.sh

      - name: Build Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\platforms\windows\build.ps1

      - name: Test Unix package
        if: matrix.platform != 'windows'
        run: ctest --test-dir build/${{ matrix.platform }} --output-on-failure

      - name: Smoke-test Windows eFerra runtime
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $Tests = @(
            "native_timer",
            "native_json",
            "primitive_methods",
            "native_thread",
            "native_thread_many",
            "native_thread_autojoin",
            "native_buffer",
            "native_file_stream",
            "native_process"
          )
          foreach ($Name in $Tests) {
            $Actual = (& .\build\windows\efe.exe ".\eferra\tests\$Name.efe" | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "$Name exited with $LASTEXITCODE" }
            $Expected = (Get-Content ".\eferra\tests\$Name.out" -Raw).Trim()
            if ($Actual -ne $Expected) { throw "$Name output differs" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ferra-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}
