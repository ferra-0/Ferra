name: Ferra release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libcurl4-openssl-dev python3

      - name: Install macOS build dependencies
        if: matrix.platform == 'macos'
        run: brew install cmake ninja curl python

      - name: Install Windows build dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          vcpkg install curl:x64-windows
          "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package Linux or macOS
        if: matrix.platform != 'windows'
        env:
          CMAKE_PREFIX_PATH: /opt/homebrew/opt/curl:/usr/local/opt/curl
        run: ./package.sh

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ferra-${{ matrix.platform }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
